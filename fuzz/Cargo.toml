[package]
name = "dvpn-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# not a member of the node's workspace (it builds with its own flags)
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.dvpn]
path = ".."

[[bin]]
name = "packet_parse"
path = "fuzz_targets/packet_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tracker_msg"
path = "fuzz_targets/tracker_msg.rs"
test = false
doc = false
bench = false

[[bin]]
