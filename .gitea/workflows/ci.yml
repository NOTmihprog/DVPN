name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: https://github.com/Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check && (cd fuzz && cargo fmt --check)
      - name: clippy
        run: cargo clippy --all-targets --locked
      - name: test
        run: cargo test --locked

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@nightly
      - uses: https://github.com/Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: install cargo-fuzz
        # ~/.cargo/bin is cached by rust-cache
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked
      - name: build targets
        run: cargo +nightly fuzz build
      # start from the corpus the nightly run grew (read only: pushes do not save it)
      - uses: https://github.com/actions/cache/restore@v4
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: run every target, in parallel
        run: tests/fuzz-all.sh 60

  netns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/dtolnay/rust-toolchain@stable
      - uses: https://github.com/Swatinem/rust-cache@v2
      - name: install tools
        run: |
          SUDO=$(command -v sudo || true)
          $SUDO apt-get update && $SUDO apt-get install -y iproute2 nftables iputils-ping iperf3 tcpdump
      - name: build
        run: cargo build --locked
      # needs unprivileged user namespaces and /dev/net/tun on the runner
      - name: netns e2e
        run: tests/netns-e2e.sh
