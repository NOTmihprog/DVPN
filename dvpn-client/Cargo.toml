[package]
name = "dvpn-client"
version = "0.1.0"
edition = "2024"
authors = ["mihprog <mih@mihprog.com>"]
license = "MIT OR Apache-2.0"
description = "Client library for the local API of a DVPN v4 node"
repository = "https://git.mihprog.com/DVPN/DVPN"

[dependencies]
log = "0.4"
rmpv = { version = "1.3", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.54", features = ["net", "sync", "time", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
