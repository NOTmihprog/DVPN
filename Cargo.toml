[package]
name = "dvpn"
version = "3.0.0"
edition = "2024"
authors = ["mihprog <mih@mihprog.com>"]
license = "GPL-3.0"
description = "Decentralized P2P VPN for building LAN networks between peers behind NAT"

[dependencies]
anyhow = "1"
arc-swap = "1.9"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0", features = ["serde"] }
hkdf = "0.13"
log = { version = "0.4", features = ["std"] }
parking_lot = "0.13"
postcard = { version = "1.1", features = ["use-std"] }
rand = "0.10"
rmpv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
toml_edit = "0.25"
tun-rs = { version = "2.8", features = ["async"] }
x25519-dalek = { version = "3.0", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1"
